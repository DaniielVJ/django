{% extends 'base.html' %}



{% block title %}
    Añadir Libro
{% endblock title %}
    



{% block content %}
    <form method="POST" enctype='multipart/form-data'>
        {% csrf_token %}
        {{form.as_div}}

        {% if form.cover.errors %}
            <div class="alert alert-danger">{{form.cover.errors}}</div>
        {% endif %}
                    
        <div>
            <button type="submit">Agregar</button>
        </div>
    </form>
{% endblock content %}
